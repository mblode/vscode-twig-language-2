name: Check
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          tools: composer:v2
      - run: npm ci
      - run: composer install --working-dir=test/php --no-interaction --prefer-dist
      - run: npm test
      - run: npm run test:oracle
      - run: npm run package
      - run: unzip 'twig-language-2-*.vsix' -d /tmp/twig-vsix
      - run: xvfb-run -a npm run test:extension
        env:
          VSCODE_VERSION: stable
          TWIG_EXTENSION_PATH: /tmp/twig-vsix/extension
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: twig-language-2
          path: "*.vsix"
